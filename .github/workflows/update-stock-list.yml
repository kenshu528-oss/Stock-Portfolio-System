name: Update Stock List

on:
  schedule:
    # 每日台灣時間 6:00 執行（UTC 22:00 前一天）- 避開所有高峰
    - cron: '0 22 * * *'
  workflow_dispatch: # 允許手動觸發

jobs:
  update-stock-list:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install Python dependencies
      run: |
        pip install FinMind tqdm pandas
        
    - name: Check if already updated today
      run: |
        TODAY=$(date +%Y-%m-%d)
        if [ -f "public/stock_list_$TODAY.json" ]; then
          FILE_DATE=$(jq -r '.date' "public/stock_list_$TODAY.json" 2>/dev/null || echo "")
          if [ "$FILE_DATE" = "$TODAY" ]; then
            echo "✅ 今日股票清單已是最新，跳過更新"
            echo "SKIP_UPDATE=true" >> $GITHUB_ENV
          else
            echo "⚠️ 檔案存在但日期不符，需要更新"
            echo "SKIP_UPDATE=false" >> $GITHUB_ENV
          fi
        else
          echo "📋 今日股票清單不存在，需要更新"
          echo "SKIP_UPDATE=false" >> $GITHUB_ENV
        fi
        
    - name: Fetch stock list
      if: env.SKIP_UPDATE != 'true'
      env:
        FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN || secrets.VITE_FINMIND_TOKEN }}
      run: |
        echo "🔍 檢查 FINMIND_TOKEN 環境變數..."
        if [ -z "$FINMIND_TOKEN" ]; then
          echo "❌ 找不到 FINMIND_TOKEN 或 VITE_FINMIND_TOKEN secret"
          exit 1
        else
          echo "✅ Token 長度: ${#FINMIND_TOKEN} 字元"
        fi
        
        cd backend
        if python fetch_stock_list.py --force; then
          echo "✅ 股票清單抓取成功"
        else
          echo "❌ 股票清單抓取失敗"
          exit 1
        fi
        
    - name: Check and copy stock list
      if: env.SKIP_UPDATE != 'true'
      run: |
        mkdir -p public
        TODAY=$(date +%Y-%m-%d)
        
        if [ -f "stock_list_$TODAY.json" ]; then
          cp "stock_list_$TODAY.json" public/stock_list.json
          cp "stock_list_$TODAY.json" "public/stock_list_$TODAY.json"
          STOCK_COUNT=$(jq '.count' public/stock_list.json)
          echo "✅ 股票清單已複製，共 $STOCK_COUNT 支"
        elif [ -f "backend/stock_list_$TODAY.json" ]; then
          cp "backend/stock_list_$TODAY.json" public/stock_list.json
          cp "backend/stock_list_$TODAY.json" "public/stock_list_$TODAY.json"
          STOCK_COUNT=$(jq '.count' public/stock_list.json)
          echo "✅ 從 backend 複製，共 $STOCK_COUNT 支"
        else
          echo "❌ 找不到今日股票清單: stock_list_$TODAY.json"
          find . -name "stock_list_*.json" -type f
          exit 1
        fi
        
    - name: Commit and push changes
      if: env.SKIP_UPDATE != 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # 只保留最近 3 天的 stock_list 日期檔案（只在 public/）
        echo "🧹 清理舊 stock_list 檔案（只保留最近 3 天）..."
        find ./public -maxdepth 1 -name "stock_list_2*-*.json" -type f | sort | head -n -3 | while read f; do
          echo "  刪除: $f"
          git rm -f "$f" 2>/dev/null || rm -f "$f"
        done
        
        # 清理根目錄的帶日期檔案（不應該存在）
        find . -maxdepth 1 -name "stock_list_2*-*.json" -type f | while read f; do
          echo "  刪除根目錄舊檔: $f"
          git rm -f "$f" 2>/dev/null || rm -f "$f"
        done
        
        git add public/stock_list*.json
        
        if git diff --staged --quiet; then
          echo "📝 無變更，跳過提交"
        else
          TODAY=$(date +%Y-%m-%d)
          git commit -m "🤖 自動更新股票清單 $TODAY"
          git push
          echo "✅ 已更新並推送"
        fi

  # 失敗通知 job（只在 update-stock-list 失敗時執行）
  notify-on-failure:
    runs-on: ubuntu-latest
    needs: update-stock-list
    if: failure()
    
    steps:
    - name: Send failure notification email
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        secure: true
        username: ${{ secrets.NOTIFY_EMAIL_USER }}
        password: ${{ secrets.NOTIFY_EMAIL_PASSWORD }}
        subject: "❌ Stock List 自動更新失敗 - ${{ github.run_id }}"
        to: ${{ secrets.NOTIFY_EMAIL_TO }}
        from: Stock Portfolio System
        body: |
          Stock List 自動更新失敗！
          
          時間：${{ github.event.head_commit.timestamp || 'N/A' }}
          執行 ID：${{ github.run_id }}
          倉庫：${{ github.repository }}
          
          請前往以下連結查看詳細錯誤：
          https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          
          可能原因：
          1. FinMind Token 過期或無效
          2. FinMind API 服務異常
          3. 網路連線問題
          
          請手動檢查並修復後，可至 Actions 頁面手動重新執行。
